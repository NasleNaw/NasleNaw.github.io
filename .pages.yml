media:
  - name: images
    label: تصاویر اخبار
    input: assets/uploads
    output: /assets/uploads
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe

content:
  - name: news
    label: اخبار
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      sort: date
      default:
        sort: date
        order: desc

    fields:

      # عنوان
      - name: title
        label: عنوان خبر
        type: string
        required: true
        options:
          maxlength: 100

      # تصویر
      - name: image
        label: تصویر خبر
        type: image
        options:
          media: images

      # توضیحات کوتاه
      - name: summary
        label: توضیحات کوتاه
        type: text
        required: true
        options:
          maxlength: 70
        description: حداکثر ۷۰ کاراکتر

      # تاریخ انتشار
      - name: date
        label: تاریخ انتشار
        type: date
        required: true

      # دسته‌بندی
      - name: category
        label: دسته‌بندی
        type: select
        required: true
        options:
          values:
          - نسل نو
            - آموزشی
            - فرهنگی
            - ورزشی
            - علمی
            - مسابقات
            - فعالیت شاگردان
            - سایر

      # میزان اهمیت
      - name: importance
        label: میزان اهمیت
        type: select
        required: true
        options:
          values:
            - عادی
            - متوسط
            - زیاد

      # لینک پست فیسبوک
      - name: link
        label: لینک پست فیسبوک
        type: string
        required: true
        description: لینک مستقیم پست منتشرشده در فیسبوک

      # وضعیت انتشار
      - name: published
        label: انتشار خبر
        type: boolean
