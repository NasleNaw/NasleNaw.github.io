media:
  - name: images
    label: تصاویر اخبار
    input: assets/uploads
    output: /assets/uploads
    categories:
      - image
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe

content:
  - name: news
    label: اخبار
    type: collection
    path: content/news
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      sort: date
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: عنوان خبر
        type: string
        required: true

      - name: image
        label: تصویر خبر
        type: image
        options:
          media: images

      - name: summary
        label: خلاصه خبر
        type: text

      - name: date
        label: تاریخ انتشار
        type: date
        required: true

      - name: body
        label: متن کامل خبر
        type: rich-text

      - name: published
        label: انتشار خبر
        type: boolean

  - name: announcements
    label: اطلاعیه‌ها
    type: collection
    path: content/announcements
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"

    view:
      primary: title
      sort: date
      default:
        sort: date
        order: desc

    fields:
      - name: title
        label: عنوان اطلاعیه
        type: string
        required: true

      - name: date
        label: تاریخ انتشار
        type: date
        required: true

      - name: summary
        label: متن اطلاعیه
        type: text
        required: true

      - name: priority
        label: اهمیت اطلاعیه
        type: select
        options:
          values:
            - label: عادی
              value: normal
            - label: مهم
              value: important
            - label: فوری
              value: urgent

      - name: published
        label: انتشار اطلاعیه
        type: boolean