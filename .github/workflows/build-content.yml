name: Build Pages CMS Content

on:
  push:
    branches:
      - main
    paths:
      - "content/news/**"
      - "content/announcements/**"
      - "scripts/build_content.py"
      - ".github/workflows/build-content.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-content:
    runs-on: ubuntu-latest

    steps:
      # دریافت فایل‌های مخزن
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      # نصب Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # نصب وابستگی‌ها
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML==6.0.2

      # ساخت فایل JSON
      - name: Generate content JSON
        run: python scripts/build_content.py

      # ثبت تغییرات در GitHub
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/data/site-content.json

          if ! git diff --cached --quiet; then
            git commit -m "Update CMS content"
            git push
          else
            echo "No changes to commit."
          fi